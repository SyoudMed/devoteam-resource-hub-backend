name: Build & Deploy NestJS with MySQL

on:
  push:
    branches:
      - develop-v7

jobs:
  build-deploy:
    name: Build and Deploy NestJS with MySQL
    runs-on: windows-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: devoteam_resources_hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Chocolatey
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force;
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072;
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
        shell: powershell

      - name: Install MySQL Client & Create Test DB
        run: |
          choco install mysql -y
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS test_devoteam_resources_hub;"
        shell: cmd

      - name: Create .env file for CI
        run: |
          echo DATABASE_HOST=localhost >> .env
          echo DATABASE_PORT=3306 >> .env
          echo DATABASE_USER=root >> .env
          echo DATABASE_PASSWORD= >> .env
          echo DATABASE_NAME=test_devoteam_resources_hub >> .env
        shell: cmd

      - name: Install Dependencies
        run: npm install
        shell: cmd

      # - name: Run Unit Tests
      #   run: npm test
      #   shell: cmd

      - name: Build the Application
        run: npm run build
        shell: cmd

      - name: Get Timestamp
        id: date
        run: echo "timestamp=%date:~10,4%-%date:~4,2%-%date:~7,2%%time:~0,2%-%time:~3,2%-%time:~6,2%" >> %GITHUB_ENV%
        shell: cmd

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nestjs-mysql:${{ env.timestamp }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nestjs-mysql:${{ env.timestamp }}