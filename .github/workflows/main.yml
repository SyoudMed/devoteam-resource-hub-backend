name: Build & Deploy NestJS with MySQL

on:
  push:
    branches:
      - develop-v5  

jobs:
  build-deploy:
    name: Build and Deploy NestJS with MySQL
    runs-on: ubuntu-latest  

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mydatabase
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test  

      - name: Build the Application
        run: npm run build

      - name: Get Timestamp
        id: date
        run: echo "timestamp=$(date +'%Y-%m-%d%H-%M-%S')" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile  
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nestjs-mysql:${{ env.timestamp }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile  
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nestjs-mysql:${{ env.timestamp }}
